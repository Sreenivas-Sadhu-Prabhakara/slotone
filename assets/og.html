<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --paper:  #F7F4EE;
    --card:   #FFFFFF;
    --line:   #E0D8C8;
    --line-s: #D0C6B2;
    --ink:    #211E19;
    --muted:  #5C554A;
    --brass:  #8A5A00;
    --brass-fill: #C8912F;
    --brass-pill: #F6ECD6;
    --cobalt: #2A5DB0;
    --free:   #2f6b45;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(180deg, #FBF9F4 0%, #F7F4EE 100%);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  /* time-grid signature */
  .tgrid { position: absolute; inset: 0; width: 1200px; height: 630px; opacity: 1; }
  .tgrid line { stroke: rgba(140,120,80,0.16); stroke-width: 1; }
  .tgrid rect { fill: rgba(140,120,80,0.13); }
  .tgrid .accent { fill: rgba(200,145,47,0.28); }

  .frame {
    position: absolute; inset: 0;
    padding: 76px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 20px; }
  .mark {
    width: 76px; height: 76px; border-radius: 18px;
    background: var(--ink);
    box-shadow: 0 16px 40px -20px rgba(40,30,10,0.5);
  }
  .wordmark { font-size: 62px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: var(--ink); }

  .headline { max-width: 960px; }
  .headline h1 {
    font-size: 60px; font-weight: 800; letter-spacing: -0.035em;
    line-height: 1.08; color: var(--ink);
  }
  .headline .accent { color: var(--brass); }
  .headline p {
    margin-top: 22px;
    font-size: 29px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--muted); line-height: 1.35; max-width: 30ch;
  }

  .chips { display: flex; align-items: center; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 11px;
    padding: 12px 20px;
    border: 1px solid var(--line-s); border-radius: 999px;
    background: var(--card);
    font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted);
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 3px; }
  .chip .dot--brass { background: var(--brass-fill); }
  .chip .dot--free { background: var(--free); }
  .chip .dot--cobalt { background: var(--cobalt); }
</style>
</head>
<body>
  <!-- time-grid field -->
  <svg class="tgrid" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="630" opacity="0.6"/>
    <line x1="360" y1="0" x2="360" y2="630" opacity="0.6"/>
    <line x1="570" y1="0" x2="570" y2="630" opacity="0.6"/>
    <line x1="780" y1="0" x2="780" y2="630" opacity="0.6"/>
    <line x1="990" y1="0" x2="990" y2="630" opacity="0.6"/>
    <!-- filled slot bars -->
    <rect x="810" y="82" width="160" height="42" rx="7" class="accent"/>
    <rect x="1020" y="152" width="150" height="42" rx="7"/>
    <rect x="810" y="222" width="160" height="42" rx="7"/>
    <rect x="1020" y="292" width="150" height="42" rx="7" class="accent"/>
    <rect x="600" y="502" width="160" height="42" rx="7"/>
    <rect x="810" y="432" width="160" height="42" rx="7"/>
  </svg>

  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#211E19"/>
        <rect x="6.5" y="6.5" width="19" height="19" rx="3.5" fill="none" stroke="#57514740" stroke-width="1.4" opacity="0.5"/>
        <line x1="6.5" y1="13" x2="25.5" y2="13" stroke="#6b6558" stroke-width="1.1"/>
        <line x1="6.5" y1="19" x2="25.5" y2="19" stroke="#6b6558" stroke-width="1.1"/>
        <rect x="8.4" y="14.6" width="8.4" height="2.8" rx="1.4" fill="#C8912F"/>
      </svg>
      <span class="wordmark">slotone</span>
    </div>

    <div class="headline">
      <h1>Your day, laid out in<br><span class="accent">clean slots.</span></h1>
      <p>A private booking day-book for a business of one.</p>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot dot--free"></span>no-overlap slot grid</span>
      <span class="chip"><span class="dot dot--brass"></span>printable day sheet</span>
      <span class="chip"><span class="dot dot--cobalt"></span>CSV export</span>
      <span class="chip"><span class="dot dot--brass"></span>offline</span>
    </div>
  </div>
</body>
</html>
