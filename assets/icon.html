<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1C1A17; }
  body { display: grid; place-items: center; }
  /* 12% safe padding on each side -> mark fills the middle 76vmin (maskable) */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="5" y="5" width="22" height="22" rx="4" fill="none" stroke="#4A4436" stroke-width="1.5"/>
    <line x1="5" y1="12.5" x2="27" y2="12.5" stroke="#4A4436" stroke-width="1.2"/>
    <line x1="5" y1="19.5" x2="27" y2="19.5" stroke="#4A4436" stroke-width="1.2"/>
    <rect x="7.4" y="14.3" width="10" height="3.4" rx="1.7" fill="#D9A441"/>
  </svg>
</body>
</html>
